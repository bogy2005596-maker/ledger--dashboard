function pBuildSettings(){
  PUI=pLoadUI();
  var rows='',light=document.documentElement.getAttribute('data-theme')==='light';
  P_OPTS.forEach(function(o){
    if(o.h){rows+='<div class="ui-grp">'+o.h+(o.d?'<small>'+o.d+'</small>':'')+'</div>';return;}
    if(o.type==='sel'||o.type==='seg'){
      var ctl='';
      if(o.type==='sel'){
        ctl='<select class="ui-sel" data-k="'+o.k+'" onchange="pPick(this.getAttribute(&quot;data-k&quot;),this.value)">';
        o.opts.forEach(function(p){ctl+='<option value="'+p[0]+'"'+(PUI[o.k]===p[0]?' selected':'')+'>'+p[1]+'</option>';});
        ctl+='</select>';
      }else{
        ctl='<span class="ui-seg" data-k="'+o.k+'">';
        o.opts.forEach(function(p){ctl+='<button type="button" class="'+(PUI[o.k]===p[0]?'on':'')+'" data-v="'+p[0]+'" onclick="pPick(this.parentNode.getAttribute(&quot;data-k&quot;),this.getAttribute(&quot;data-v&quot;))">'+p[1]+'</button>';});
        ctl+='</span>';
      }
      rows+='<div class="ui-row"><span class="ui-txt"><span class="ui-name">'+o.t+'</span>'+(o.d?'<span class="ui-desc">'+o.d+'</span>':'')+'</span>'+ctl+'</div>';
      return;
    }
    var chk=o.type==='theme'?!light:(PUI[o.k]===o.on);
    rows+='<label class="ui-row"><span class="ui-txt"><span class="ui-name">'+o.t+'</span><span class="ui-desc">'+o.d+'</span></span>'
      +'<span class="ui-sw"><input type="checkbox" data-k="'+o.k+'" '+(chk?'checked':'')+' onchange="pTog(this)"><span></span></span></label>';
  });
  document.getElementById('set-body').innerHTML=rows;
}
function pTog(cb){
  var k=cb.getAttribute('data-k');
  if(k==='theme'){toggleTheme();return;}
  var o=P_OPTS.filter(function(x){return x.k===k;})[0];if(!o)return;
  pPick(k,cb.checked?o.on:o.off);
}
function pResetUI(){try{localStorage.removeItem('ledger_ui');}catch(e){}PUI=pLoadUI();gApply();pBuildSettings();}
function openSettings(){pBuildSettings();document.getElementById('set-ov').classList.add('open');}
function closeSettings(){document.getElementById('set-ov').classList.remove('open');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSettings();});
